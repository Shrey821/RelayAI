<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>RelayAI Companion</title>
  <link rel="stylesheet" href="styles.css">
</head>
<body>
  <div class="popup-container">
    <!-- Header -->
    <header class="header">
      <div class="logo-group">
        <div class="logo-mark">
          <svg width="15" height="15" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2.5" stroke-linecap="round" stroke-linejoin="round">
            <polyline points="13 2 3 14 12 14 11 22 21 10 12 10 13 2"/>
          </svg>
        </div>
        <div class="brand-text">
          <h1 class="title">Relay<span class="brand-accent">AI</span></h1>
          <span class="subtitle">Cross-LLM Context Bridge</span>
        </div>
      </div>
      <div id="server-status-pill" class="status-pill offline" title="Connection to local RelayAI server">
        <span id="server-status-text">Checking</span>
      </div>
    </header>

    <!-- Mode Selector Tabs (Clean & Modest) -->
    <div class="mode-tabs">
      <button id="tab-btn-handoff" class="mode-tab active" data-mode="handoff">
        Chat Handoff
      </button>
      <button id="tab-btn-memory" class="mode-tab" data-mode="memory">
        Memory Sync
      </button>
    </div>

    <!-- VIEW 1: CHAT HANDOFF (Unified & Clear) -->
    <div id="view-handoff" class="mode-view active">
      <div class="card" id="radar-card">
        <!-- Active Tabs Radar Bar -->
        <div class="radar-status-bar">
          <div class="radar-status-left">
            <span class="radar-label">Detected AI Tabs</span>
            <span class="badge" id="radar-count-badge">Scanning...</span>
          </div>
          <button id="btn-rescan-tabs" class="btn-icon-subtle" title="Rescan open tabs">
            <svg width="12" height="12" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2"><path d="M21.5 2v6h-6M21.34 15.57a10 10 0 1 1-.57-8.38l5.67-5.67"/></svg>
          </button>
        </div>

        <!-- Open Tabs List -->
        <div class="radar-tabs-list" id="radar-tabs-list">
          <div class="radar-tab-row">
            <span class="radar-tab-role">Scanning open tabs...</span>
          </div>
        </div>

        <!-- Source & Target Chat Selectors -->
        <div id="radar-controls-box" class="radar-controls-box mt-3 d-none">
          <div class="selector-field">
            <label class="field-label" for="radar-source-select">From (Source Chat):</label>
            <div class="select-wrapper">
              <select id="radar-source-select" class="form-select"></select>
            </div>
          </div>

          <div class="selector-field mt-2">
            <label class="field-label" for="radar-target-select">To (Destination Chat):</label>
            <div class="select-wrapper">
              <select id="radar-target-select" class="form-select"></select>
            </div>
          </div>

          <!-- Modest, Clear Transfer Buttons -->
          <div class="transfer-actions mt-3">
            <button id="btn-auto-transfer-summary" class="btn btn-primary w-100">
              Transfer Condensed Summary ➔
            </button>
            <button id="btn-auto-transfer-full" class="btn btn-ghost w-100 mt-1">
              Transfer Full Transcript (As-Is)
            </button>
          </div>
        </div>

        <!-- Fallback Quick Trigger -->
        <div class="fallback-row mt-2">
          <button id="btn-distill-active-chat" class="btn-link">
            ⚡ Distill current tab directly
          </button>
        </div>
      </div>

      <!-- Distilled Results Details (Shown after transfer or distillation) -->
      <div id="distilled-summary-card" class="result-card d-none mt-2">
        <div class="result-header">
          <span class="badge badge-emerald" id="metric-savings">Savings: 92%</span>
          <span class="badge badge-subtle" id="metric-tokens">~280 tokens</span>
        </div>
        <div class="result-body mt-2">
          <div class="result-line"><strong>Goal:</strong> <span id="distill-goal">-</span></div>
          <div class="result-line"><strong>Next:</strong> <span id="distill-next">-</span></div>
        </div>
        <div class="result-actions mt-2">
          <button id="btn-open-and-inject" class="btn btn-primary btn-sm">
            Launch & Inject Context
          </button>
          <button id="btn-copy-handoff-primer" class="btn btn-secondary btn-sm">
            Copy Prompt
          </button>
        </div>
      </div>
    </div>

    <!-- VIEW 2: LONG-TERM MEMORY (Clean & Modest) -->
    <div id="view-memory" class="mode-view d-none">
      <div class="card">
        <div class="card-header-compact">
          <span class="section-tag">Active Memory Profile</span>
          <a href="http://127.0.0.1:8000" target="_blank" class="link-subtle">Open Vault ↗</a>
        </div>
        <div id="persona-name" class="profile-title mt-1">Lead Full-Stack Architect</div>
        <div id="persona-tech" class="profile-subtitle">TypeScript, Next.js, Python</div>

        <div class="actions-group mt-3">
          <button id="btn-auto-inject" class="btn btn-primary w-100">
            Sync Memory into Active Tab
          </button>
          <button id="btn-verify-chat" class="btn btn-secondary w-100 mt-2">
            Send Verification Query
          </button>
        </div>
      </div>
    </div>

    <!-- Status Message Display -->
    <div id="status-feedback" class="status-feedback d-none"></div>

    <!-- Modest Footer -->
    <footer class="footer">
      <a href="http://127.0.0.1:8000" target="_blank" class="footer-link">RelayAI Dashboard</a>
      <span class="footer-dot">•</span>
      <a href="https://github.com/Shrey821/RelayAI" target="_blank" class="footer-link">GitHub</a>
    </footer>
  </div>

  <script src="popup.js"></script>
</body>
</html>
